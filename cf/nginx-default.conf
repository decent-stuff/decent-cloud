server {
    listen 59010;
    server_name _;

    # Serve static website
    root /usr/share/nginx/html;
    index index.html;

    # Service worker: never cache so browsers always fetch the latest version
    # on update-check (exact match wins over the .js regex below; an immutable
    # sw.js would freeze users on a stale worker forever).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Serve static assets directly - return 404 if missing
    location ~* \.(ico|png|svg|jpg|jpeg|js|css|json|txt|xml|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SvelteKit build files - return 404 if missing
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images directory - return 404 if missing
    location /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Docs directory - serve files directly with proper mime types
    location /docs/ {
        # Explicit MIME type for PDFs
        location ~ \.pdf$ {
            add_header Content-Type application/pdf;
            add_header Content-Disposition inline;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicon - return 404 if missing
    location /favicon.svg {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing for HTML requests only - fallback to index.html
    # This ensures that only navigation requests get the SPA fallback
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy";
        add_header Content-Type text/plain;
    }
}

  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: chatwoot-web
  namespace: apps
  labels:
    app.kubernetes.io/name: chatwoot-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chatwoot-web
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: decent-cloud-redis
  namespace: apps
  labels:
    app.kubernetes.io/name: decent-cloud-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: decent-cloud-redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP

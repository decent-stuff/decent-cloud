# Decent Cloud production deployment (k3s + ArgoCD, namespace `apps`).
#
# Owned by this repo (deploy/k8s). The nuc-k3s operator repo only holds the
# ArgoCD Application CR + the SOPS-encrypted secret (see ../nuc-k3s/).
#
# Public exposure is via a Cloudflare Tunnel (`cloudflared` Deployment below);
# decent-cloud.org is a SEPARATE zone, so there are NO Traefik Ingresses here.
# Host Postgres (192.168.0.2:5432) is reached directly by env value — no DB pod.
# Databases `decent_cloud_prod` and `chatwoot_prod` already exist on the host.
#
# Image tags for `api`/`website` are bumped on each release by the
# `deploy-prod` CI job (lines tagged `# deploy-prod:<name>`).

# ---------------------------------------------------------------------------
# api — Rust api-server (HTTP API on :59001)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: apps
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: server
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
      - name: forgejo-registry-secret
      containers:
      - name: api
        image: git.kalaj.org/decent-stuff/decent-cloud-api:c1820a0d  # deploy-prod:api
        imagePullPolicy: IfNotPresent
        command: ["api-server", "serve"]
        env:
        - name: ENVIRONMENT
          value: prod
        - name: RUST_LOG
          value: info
        - name: API_SERVER_PORT
          value: "59001"
        - name: LEDGER_DIR
          value: /data/ledger
        - name: CANISTER_ID
          value: ggi4a-wyaaa-aaaai-actqq-cai
        - name: CF_DOMAIN
          value: decent-cloud.org
        - name: CF_GW_PREFIX
          value: gw
        - name: API_PUBLIC_URL
          value: https://api.decent-cloud.org
        - name: CHATWOOT_BASE_URL
          value: http://chatwoot-web.apps.svc.cluster.local:80
        - name: CHATWOOT_FRONTEND_URL
          value: https://support.decent-cloud.org
        - name: CHATWOOT_ACCOUNT_ID
          value: "1"
        - name: CHATWOOT_INBOX_ID
          value: "1"
        - name: TELEGRAM_BOT_USERNAME
          value: DecentCloudBot
        - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: API_DATABASE_URL}}}
        - {name: CREDENTIAL_ENCRYPTION_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CREDENTIAL_ENCRYPTION_KEY}}}
        - {name: CF_API_TOKEN, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CF_API_TOKEN}}}
        - {name: CF_ZONE_ID, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CF_ZONE_ID}}}
        - {name: STRIPE_SECRET_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: STRIPE_SECRET_KEY}}}
        - {name: STRIPE_PUBLISHABLE_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: STRIPE_PUBLISHABLE_KEY}}}
        - {name: STRIPE_WEBHOOK_SECRET, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: STRIPE_WEBHOOK_SECRET}}}
        - {name: INVOICE_SELLER_IBAN, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: INVOICE_SELLER_IBAN}}}
        - {name: GOOGLE_OAUTH_CLIENT_ID, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: GOOGLE_OAUTH_CLIENT_ID}}}
        - {name: GOOGLE_OAUTH_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: GOOGLE_OAUTH_CLIENT_SECRET}}}
        - {name: GOOGLE_OAUTH_REDIRECT_URL, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: GOOGLE_OAUTH_REDIRECT_URL}}}
        - {name: FRONTEND_URL, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: FRONTEND_URL}}}
        - {name: MAILCHANNELS_API_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: MAILCHANNELS_API_KEY}}}
        - {name: DKIM_DOMAIN, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: DKIM_DOMAIN}}}
        - {name: DKIM_SELECTOR, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: DKIM_SELECTOR}}}
        - {name: DKIM_PRIVATE_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: DKIM_PRIVATE_KEY}}}
        - {name: CHATWOOT_API_TOKEN, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CHATWOOT_API_TOKEN}}}
        - {name: CHATWOOT_PLATFORM_API_TOKEN, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CHATWOOT_PLATFORM_API_TOKEN}}}
        - {name: CHATWOOT_HMAC_SECRET, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CHATWOOT_HMAC_SECRET}}}
        - {name: DEFAULT_ESCALATION_USER, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: DEFAULT_ESCALATION_USER}}}
        - {name: TELEGRAM_BOT_TOKEN, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: TELEGRAM_BOT_TOKEN}}}
        - {name: TEXTBEE_DEVICE_ID, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: TEXTBEE_DEVICE_ID}}}
        - {name: TEXTBEE_API_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: TEXTBEE_API_KEY}}}
        - {name: TEXTBEE_API_URL, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: TEXTBEE_API_URL}}}
        - {name: TWILIO_ACCOUNT_SID, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: TWILIO_ACCOUNT_SID}}}
        - {name: TWILIO_AUTH_TOKEN, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: TWILIO_AUTH_TOKEN}}}
        - {name: TWILIO_PHONE_NUMBER, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: TWILIO_PHONE_NUMBER}}}
        - {name: LLM_API_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: LLM_API_KEY}}}
        - {name: LLM_API_URL, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: LLM_API_URL}}}
        - {name: LLM_API_MODEL, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: LLM_API_MODEL}}}
        ports:
        - name: http
          containerPort: 59001
        volumeMounts:
        - name: api-data
          mountPath: /data
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
      volumes:
      - name: api-data
        hostPath:
          path: /home/sat/apps/decent-cloud/api-data
          type: DirectoryOrCreate
---
# ---------------------------------------------------------------------------
# api-sync — same image, runs the ledger sync loop (`api-server sync`)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-sync
  namespace: apps
  labels:
    app.kubernetes.io/name: api-sync
    app.kubernetes.io/component: sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-sync
        app.kubernetes.io/component: sync
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
      - name: forgejo-registry-secret
      containers:
      - name: api-sync
        image: git.kalaj.org/decent-stuff/decent-cloud-api:c1820a0d  # deploy-prod:api
        imagePullPolicy: IfNotPresent
        command: ["api-server", "sync"]
        env:
        - name: ENVIRONMENT
          value: prod
        - name: RUST_LOG
          value: info
        - name: API_SERVER_PORT
          value: "59001"
        - name: LEDGER_DIR
          value: /data/ledger
        - name: SYNC_INTERVAL_SECS
          value: "30"
        - name: CANISTER_ID
          value: ggi4a-wyaaa-aaaai-actqq-cai
        - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: API_DATABASE_URL}}}
        - {name: CREDENTIAL_ENCRYPTION_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CREDENTIAL_ENCRYPTION_KEY}}}
        volumeMounts:
        - name: api-data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: api-data
        hostPath:
          path: /home/sat/apps/decent-cloud/api-data
          type: DirectoryOrCreate
---
# ---------------------------------------------------------------------------
# website — nginx serving the SvelteKit static build (listens on :59010)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: apps
  labels:
    app.kubernetes.io/name: website
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website
        app.kubernetes.io/component: web
    spec:
      enableServiceLinks: false
      imagePullSecrets:
      - name: forgejo-registry-secret
      containers:
      - name: website
        image: git.kalaj.org/decent-stuff/decent-cloud-website:c1820a0d  # deploy-prod:website
        imagePullPolicy: IfNotPresent
        env:
        - name: ENVIRONMENT
          value: prod
        ports:
        - name: http
          containerPort: 59010
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 3
---
# ---------------------------------------------------------------------------
# chatwoot-web — customer support UI (Rails, listens on :59102)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatwoot-web
  namespace: apps
  labels:
    app.kubernetes.io/name: chatwoot-web
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chatwoot-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwoot-web
        app.kubernetes.io/component: web
    spec:
      enableServiceLinks: false
      containers:
      - name: chatwoot-web
        image: chatwoot/chatwoot:v4.8.0
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "rm -f /app/tmp/pids/server.pid && bundle exec rails s -p 59102 -b '0.0.0.0'"]
        env:
        - {name: RAILS_ENV, value: production}
        - {name: POSTGRES_HOST, value: 192.168.0.2}
        - {name: POSTGRES_PORT, value: "5432"}
        - {name: POSTGRES_DATABASE, value: chatwoot_prod}
        - {name: POSTGRES_USERNAME, value: chatwoot_prod}
        - {name: REDIS_URL, value: redis://decent-cloud-redis.apps.svc.cluster.local:6379}
        - {name: FRONTEND_URL, value: https://support.decent-cloud.org}
        - {name: MAILER_SENDER_EMAIL, value: support@decent-cloud.org}
        - {name: SMTP_PORT, value: "587"}
        - {name: SMTP_AUTHENTICATION, value: plain}
        - {name: SMTP_ENABLE_STARTTLS_AUTO, value: "true"}
        - {name: DISABLE_TELEMETRY, value: "true"}
        - {name: SECRET_KEY_BASE, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CHATWOOT_SECRET_KEY_BASE}}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CHATWOOT_POSTGRES_PASSWORD}}}
        - {name: CHATWOOT_INBOX_HMAC_SECRET_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CHATWOOT_HMAC_SECRET}}}
        - {name: SMTP_ADDRESS, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: SMTP_ADDRESS}}}
        - {name: SMTP_USERNAME, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: SMTP_USERNAME}}}
        - {name: SMTP_PASSWORD, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: SMTP_PASSWORD}}}
        - {name: OPENAI_API_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: OPENAI_API_KEY}}}
        ports:
        - name: http
          containerPort: 59102
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        readinessProbe:
          exec:
            command: ["sh", "-c", "wget -qO- http://127.0.0.1:59102/api >/dev/null 2>&1 || exit 1"]
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          exec:
            command: ["sh", "-c", "wget -qO- http://127.0.0.1:59102/api >/dev/null 2>&1 || exit 1"]
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 10
---
# ---------------------------------------------------------------------------
# chatwoot-worker — sidekiq background jobs (same image, same env)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatwoot-worker
  namespace: apps
  labels:
    app.kubernetes.io/name: chatwoot-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chatwoot-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwoot-worker
        app.kubernetes.io/component: worker
    spec:
      enableServiceLinks: false
      containers:
      - name: chatwoot-worker
        image: chatwoot/chatwoot:v4.8.0
        imagePullPolicy: IfNotPresent
        command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
        env:
        - {name: RAILS_ENV, value: production}
        - {name: POSTGRES_HOST, value: 192.168.0.2}
        - {name: POSTGRES_PORT, value: "5432"}
        - {name: POSTGRES_DATABASE, value: chatwoot_prod}
        - {name: POSTGRES_USERNAME, value: chatwoot_prod}
        - {name: REDIS_URL, value: redis://decent-cloud-redis.apps.svc.cluster.local:6379}
        - {name: FRONTEND_URL, value: https://support.decent-cloud.org}
        - {name: MAILER_SENDER_EMAIL, value: support@decent-cloud.org}
        - {name: SMTP_PORT, value: "587"}
        - {name: SMTP_AUTHENTICATION, value: plain}
        - {name: SMTP_ENABLE_STARTTLS_AUTO, value: "true"}
        - {name: DISABLE_TELEMETRY, value: "true"}
        - {name: SECRET_KEY_BASE, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CHATWOOT_SECRET_KEY_BASE}}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CHATWOOT_POSTGRES_PASSWORD}}}
        - {name: CHATWOOT_INBOX_HMAC_SECRET_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CHATWOOT_HMAC_SECRET}}}
        - {name: SMTP_ADDRESS, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: SMTP_ADDRESS}}}
        - {name: SMTP_USERNAME, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: SMTP_USERNAME}}}
        - {name: SMTP_PASSWORD, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: SMTP_PASSWORD}}}
        - {name: OPENAI_API_KEY, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: OPENAI_API_KEY}}}
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
---
# ---------------------------------------------------------------------------
# chatwoot-migrate — one-shot DB migration. ArgoCD Sync hook: runs on every
# sync, deleting the previous Job first (BeforeHookCreation). Idempotent.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: chatwoot-migrate
  namespace: apps
  labels:
    app.kubernetes.io/name: chatwoot-migrate
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwoot-migrate
        app.kubernetes.io/component: migrate
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
      - name: chatwoot-migrate
        image: chatwoot/chatwoot:v4.8.0
        imagePullPolicy: IfNotPresent
        command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
        env:
        - {name: RAILS_ENV, value: production}
        - {name: POSTGRES_HOST, value: 192.168.0.2}
        - {name: POSTGRES_PORT, value: "5432"}
        - {name: POSTGRES_DATABASE, value: chatwoot_prod}
        - {name: POSTGRES_USERNAME, value: chatwoot_prod}
        - {name: REDIS_URL, value: redis://decent-cloud-redis.apps.svc.cluster.local:6379}
        - {name: SECRET_KEY_BASE, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CHATWOOT_SECRET_KEY_BASE}}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: decent-cloud-secret, key: CHATWOOT_POSTGRES_PASSWORD}}}
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
---
# ---------------------------------------------------------------------------
# decent-cloud-redis — dedicated Redis for Chatwoot queues (NOT the shared one)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decent-cloud-redis
  namespace: apps
  labels:
    app.kubernetes.io/name: decent-cloud-redis
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: decent-cloud-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decent-cloud-redis
        app.kubernetes.io/component: redis
    spec:
      enableServiceLinks: false
      containers:
      - name: redis
        image: redis:8-alpine
        imagePullPolicy: IfNotPresent
        args: ["redis-server", "--appendonly", "yes"]
        ports:
        - name: redis
          containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 3
      volumes:
      - name: redis-data
        hostPath:
          path: /home/sat/apps/decent-cloud/redis
          type: DirectoryOrCreate
---
# ---------------------------------------------------------------------------
# cloudflared — outbound Cloudflare Tunnel connector (decent-cloud.org zone).
# No inbound health port: cloudflared only connects OUT to Cloudflare; if it
# crashes, the container restarts (strategy: Recreate). TUNNEL_TOKEN is the
# connector token captured at tunnel creation (cf/tunnel.py prod).
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: apps
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/component: tunnel
    spec:
      enableServiceLinks: false
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        imagePullPolicy: IfNotPresent
        command: ["cloudflared", "tunnel", "--no-autoupdate", "run"]
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: decent-cloud-secret
              key: TUNNEL_TOKEN_PROD
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---

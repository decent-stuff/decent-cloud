# Decent Cloud production deployment (k3s + ArgoCD, namespace `apps`).
#
# Owned by this repo (deploy/k8s/decent-cloud/). The k8s operator repo only
# holds the ArgoCD Application CR + the SOPS-encrypted secret (see ../k8s/).
#
# All decent-cloud resources share the `dc-` prefix for discoverability in
# `kubectl -n apps`. Public exposure is via a Cloudflare Tunnel (`dc-cloudflared`
# Deployment in dc-cloudflared.yaml); decent-cloud.org is a SEPARATE zone, so
# there are NO Traefik Ingresses here. Host Postgres (192.168.0.2:5432) is
# reached directly by env value — no DB pod. Databases `decent_cloud_prod` and
# `chatwoot_prod` already exist on the host.
#
# Image tags for `dc-api`/`dc-website` are bumped on each release by the
# `deploy-prod` CI job (lines tagged `# deploy-prod:<name>`).

---
# ---------------------------------------------------------------------------
# dc-config — non-secret configuration (12-Factor: config != secret).
# Public identifiers/URLs/model-names. Secret values stay in `dc-secret`;
# these don't couple to secret rotation. Values mirror the prod secret at split time.
# ---------------------------------------------------------------------------

---
# ---------------------------------------------------------------------------
# dc-api — Rust api-server (HTTP API on :59001)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-api
  namespace: apps
  labels:
    app.kubernetes.io/name: dc-api
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dc-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dc-api
        app.kubernetes.io/component: server
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
      - name: forgejo-registry-secret
      containers:
      - name: api
        image: git.kalaj.org/decent-stuff/decent-cloud-api:c1820a0d  # deploy-prod:api
        imagePullPolicy: IfNotPresent
        command: ["api-server", "serve"]
        env:
        - name: ENVIRONMENT
          value: prod
        - name: RUST_LOG
          value: info
        - name: API_SERVER_PORT
          value: "59001"
        - name: LEDGER_DIR
          value: /data/ledger
        - name: CANISTER_ID
          value: ggi4a-wyaaa-aaaai-actqq-cai
        - name: CF_DOMAIN
          value: decent-cloud.org
        - name: CF_GW_PREFIX
          value: gw
        - name: API_PUBLIC_URL
          value: https://api.decent-cloud.org
        - name: CHATWOOT_BASE_URL
          value: http://dc-chatwoot-web.apps.svc.cluster.local:80
        - name: CHATWOOT_FRONTEND_URL
          value: https://support.decent-cloud.org
        - name: CHATWOOT_ACCOUNT_ID
          value: "1"
        - name: CHATWOOT_INBOX_ID
          value: "1"
        - name: TELEGRAM_BOT_USERNAME
          value: DecentCloudBot
        - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: dc-secret, key: API_DATABASE_URL}}}
        - {name: CREDENTIAL_ENCRYPTION_KEY, valueFrom: {secretKeyRef: {name: dc-secret, key: CREDENTIAL_ENCRYPTION_KEY}}}
        - {name: CF_API_TOKEN, valueFrom: {secretKeyRef: {name: dc-secret, key: CF_API_TOKEN}}}
        - {name: CF_ZONE_ID, valueFrom: {configMapKeyRef: {name: dc-config, key: CF_ZONE_ID}}}
        - {name: STRIPE_SECRET_KEY, valueFrom: {secretKeyRef: {name: dc-secret, key: STRIPE_SECRET_KEY}}}
        - {name: STRIPE_PUBLISHABLE_KEY, valueFrom: {configMapKeyRef: {name: dc-config, key: STRIPE_PUBLISHABLE_KEY}}}
        - {name: STRIPE_WEBHOOK_SECRET, valueFrom: {secretKeyRef: {name: dc-secret, key: STRIPE_WEBHOOK_SECRET}}}
        - {name: INVOICE_SELLER_IBAN, valueFrom: {secretKeyRef: {name: dc-secret, key: INVOICE_SELLER_IBAN}}}
        - {name: GOOGLE_OAUTH_CLIENT_ID, valueFrom: {configMapKeyRef: {name: dc-config, key: GOOGLE_OAUTH_CLIENT_ID}}}
        - {name: GOOGLE_OAUTH_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: dc-secret, key: GOOGLE_OAUTH_CLIENT_SECRET}}}
        - {name: GOOGLE_OAUTH_REDIRECT_URL, valueFrom: {configMapKeyRef: {name: dc-config, key: GOOGLE_OAUTH_REDIRECT_URL}}}
        - {name: FRONTEND_URL, valueFrom: {configMapKeyRef: {name: dc-config, key: FRONTEND_URL}}}
        - {name: MAILCHANNELS_API_KEY, valueFrom: {secretKeyRef: {name: dc-secret, key: MAILCHANNELS_API_KEY}}}
        - {name: DKIM_DOMAIN, valueFrom: {configMapKeyRef: {name: dc-config, key: DKIM_DOMAIN}}}
        - {name: DKIM_SELECTOR, valueFrom: {configMapKeyRef: {name: dc-config, key: DKIM_SELECTOR}}}
        - {name: DKIM_PRIVATE_KEY, valueFrom: {secretKeyRef: {name: dc-secret, key: DKIM_PRIVATE_KEY}}}
        - {name: CHATWOOT_API_TOKEN, valueFrom: {secretKeyRef: {name: dc-secret, key: CHATWOOT_API_TOKEN}}}
        - {name: CHATWOOT_PLATFORM_API_TOKEN, valueFrom: {secretKeyRef: {name: dc-secret, key: CHATWOOT_PLATFORM_API_TOKEN}}}
        - {name: CHATWOOT_HMAC_SECRET, valueFrom: {secretKeyRef: {name: dc-secret, key: CHATWOOT_HMAC_SECRET}}}
        - {name: DEFAULT_ESCALATION_USER, valueFrom: {configMapKeyRef: {name: dc-config, key: DEFAULT_ESCALATION_USER}}}
        - {name: TELEGRAM_BOT_TOKEN, valueFrom: {secretKeyRef: {name: dc-secret, key: TELEGRAM_BOT_TOKEN}}}
        - {name: TEXTBEE_DEVICE_ID, valueFrom: {configMapKeyRef: {name: dc-config, key: TEXTBEE_DEVICE_ID}}}
        - {name: TEXTBEE_API_KEY, valueFrom: {secretKeyRef: {name: dc-secret, key: TEXTBEE_API_KEY}}}
        - {name: TEXTBEE_API_URL, valueFrom: {configMapKeyRef: {name: dc-config, key: TEXTBEE_API_URL}}}
        - {name: TWILIO_ACCOUNT_SID, valueFrom: {configMapKeyRef: {name: dc-config, key: TWILIO_ACCOUNT_SID}}}
        - {name: TWILIO_AUTH_TOKEN, valueFrom: {secretKeyRef: {name: dc-secret, key: TWILIO_AUTH_TOKEN}}}
        - {name: TWILIO_PHONE_NUMBER, valueFrom: {configMapKeyRef: {name: dc-config, key: TWILIO_PHONE_NUMBER}}}
        - {name: LLM_API_KEY, valueFrom: {secretKeyRef: {name: dc-secret, key: LLM_API_KEY}}}
        - {name: LLM_API_URL, valueFrom: {configMapKeyRef: {name: dc-config, key: LLM_API_URL}}}
        - {name: LLM_API_MODEL, valueFrom: {configMapKeyRef: {name: dc-config, key: LLM_API_MODEL}}}
        ports:
        - name: http
          containerPort: 59001
        volumeMounts:
        - name: api-data
          mountPath: /data
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
      volumes:
      - name: api-data
        hostPath:
          path: /home/sat/apps/decent-cloud/api-data
          type: DirectoryOrCreate
---
# ---------------------------------------------------------------------------
# dc-api-sync — same image, runs the ledger sync loop (`api-server sync`)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-api-sync
  namespace: apps
  labels:
    app.kubernetes.io/name: dc-api-sync
    app.kubernetes.io/component: sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dc-api-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dc-api-sync
        app.kubernetes.io/component: sync
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
      - name: forgejo-registry-secret
      containers:
      - name: api-sync
        image: git.kalaj.org/decent-stuff/decent-cloud-api:c1820a0d  # deploy-prod:api
        imagePullPolicy: IfNotPresent
        command: ["api-server", "sync"]
        env:
        - name: ENVIRONMENT
          value: prod
        - name: RUST_LOG
          value: info
        - name: API_SERVER_PORT
          value: "59001"
        - name: LEDGER_DIR
          value: /data/ledger
        - name: SYNC_INTERVAL_SECS
          value: "30"
        - name: CANISTER_ID
          value: ggi4a-wyaaa-aaaai-actqq-cai
        - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: dc-secret, key: API_DATABASE_URL}}}
        - {name: CREDENTIAL_ENCRYPTION_KEY, valueFrom: {secretKeyRef: {name: dc-secret, key: CREDENTIAL_ENCRYPTION_KEY}}}
        volumeMounts:
        - name: api-data
          mountPath: /data
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 1Gi
      volumes:
      - name: api-data
        hostPath:
          path: /home/sat/apps/decent-cloud/api-data
          type: DirectoryOrCreate
---
# Service — ClusterIP port 80 → named targetPort (cluster convention)
apiVersion: v1
kind: Service
metadata:
  name: dc-api
  namespace: apps
  labels:
    app.kubernetes.io/name: dc-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dc-api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

---
# ---------------------------------------------------------------------------
# dc-chatwoot-web — customer support UI (Rails, listens on :59102)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-chatwoot-web
  namespace: apps
  labels:
    app.kubernetes.io/name: dc-chatwoot-web
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dc-chatwoot-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dc-chatwoot-web
        app.kubernetes.io/component: web
    spec:
      enableServiceLinks: false
      containers:
      - name: chatwoot-web
        image: chatwoot/chatwoot:v4.8.0
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "rm -f /app/tmp/pids/server.pid && bundle exec rails s -p 59102 -b '0.0.0.0'"]
        env:
        - {name: RAILS_ENV, value: production}
        - {name: POSTGRES_HOST, value: 192.168.0.2}
        - {name: POSTGRES_PORT, value: "5432"}
        - {name: POSTGRES_DATABASE, value: chatwoot_prod}
        - {name: POSTGRES_USERNAME, value: chatwoot_prod}
        - {name: REDIS_URL, value: redis://dc-redis.apps.svc.cluster.local:6379}
        - {name: FRONTEND_URL, value: https://support.decent-cloud.org}
        - {name: MAILER_SENDER_EMAIL, value: support@decent-cloud.org}
        - {name: SMTP_PORT, value: "587"}
        - {name: SMTP_AUTHENTICATION, value: plain}
        - {name: SMTP_ENABLE_STARTTLS_AUTO, value: "true"}
        - {name: DISABLE_TELEMETRY, value: "true"}
        - {name: SECRET_KEY_BASE, valueFrom: {secretKeyRef: {name: dc-secret, key: CHATWOOT_SECRET_KEY_BASE}}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: dc-secret, key: CHATWOOT_POSTGRES_PASSWORD}}}
        - {name: CHATWOOT_INBOX_HMAC_SECRET_KEY, valueFrom: {secretKeyRef: {name: dc-secret, key: CHATWOOT_HMAC_SECRET}}}
        - {name: SMTP_ADDRESS, valueFrom: {configMapKeyRef: {name: dc-config, key: SMTP_ADDRESS}}}
        - {name: SMTP_USERNAME, valueFrom: {configMapKeyRef: {name: dc-config, key: SMTP_USERNAME}}}
        - {name: SMTP_PASSWORD, valueFrom: {secretKeyRef: {name: dc-secret, key: SMTP_PASSWORD}}}
        - {name: OPENAI_API_KEY, valueFrom: {secretKeyRef: {name: dc-secret, key: OPENAI_API_KEY}}}
        ports:
        - name: http
          containerPort: 59102
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 2Gi
        readinessProbe:
          exec:
            command: ["sh", "-c", "wget -qO- http://127.0.0.1:59102/api >/dev/null 2>&1 || exit 1"]
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          exec:
            command: ["sh", "-c", "wget -qO- http://127.0.0.1:59102/api >/dev/null 2>&1 || exit 1"]
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 10
---
# ---------------------------------------------------------------------------
# dc-chatwoot-worker — sidekiq background jobs (same image, same env)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-chatwoot-worker
  namespace: apps
  labels:
    app.kubernetes.io/name: dc-chatwoot-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dc-chatwoot-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dc-chatwoot-worker
        app.kubernetes.io/component: worker
    spec:
      enableServiceLinks: false
      containers:
      - name: chatwoot-worker
        image: chatwoot/chatwoot:v4.8.0
        imagePullPolicy: IfNotPresent
        command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
        env:
        - {name: RAILS_ENV, value: production}
        - {name: POSTGRES_HOST, value: 192.168.0.2}
        - {name: POSTGRES_PORT, value: "5432"}
        - {name: POSTGRES_DATABASE, value: chatwoot_prod}
        - {name: POSTGRES_USERNAME, value: chatwoot_prod}
        - {name: REDIS_URL, value: redis://dc-redis.apps.svc.cluster.local:6379}
        - {name: FRONTEND_URL, value: https://support.decent-cloud.org}
        - {name: MAILER_SENDER_EMAIL, value: support@decent-cloud.org}
        - {name: SMTP_PORT, value: "587"}
        - {name: SMTP_AUTHENTICATION, value: plain}
        - {name: SMTP_ENABLE_STARTTLS_AUTO, value: "true"}
        - {name: DISABLE_TELEMETRY, value: "true"}
        - {name: SECRET_KEY_BASE, valueFrom: {secretKeyRef: {name: dc-secret, key: CHATWOOT_SECRET_KEY_BASE}}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: dc-secret, key: CHATWOOT_POSTGRES_PASSWORD}}}
        - {name: CHATWOOT_INBOX_HMAC_SECRET_KEY, valueFrom: {secretKeyRef: {name: dc-secret, key: CHATWOOT_HMAC_SECRET}}}
        - {name: SMTP_ADDRESS, valueFrom: {configMapKeyRef: {name: dc-config, key: SMTP_ADDRESS}}}
        - {name: SMTP_USERNAME, valueFrom: {configMapKeyRef: {name: dc-config, key: SMTP_USERNAME}}}
        - {name: SMTP_PASSWORD, valueFrom: {secretKeyRef: {name: dc-secret, key: SMTP_PASSWORD}}}
        - {name: OPENAI_API_KEY, valueFrom: {secretKeyRef: {name: dc-secret, key: OPENAI_API_KEY}}}
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 2Gi
---
# ---------------------------------------------------------------------------
# dc-chatwoot-migrate — one-shot DB migration. ArgoCD Sync hook: runs on every
# sync, deleting the previous Job first (BeforeHookCreation). Idempotent.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: dc-chatwoot-migrate
  namespace: apps
  labels:
    app.kubernetes.io/name: dc-chatwoot-migrate
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dc-chatwoot-migrate
        app.kubernetes.io/component: migrate
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
      - name: chatwoot-migrate
        image: chatwoot/chatwoot:v4.8.0
        imagePullPolicy: IfNotPresent
        command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
        env:
        - {name: RAILS_ENV, value: production}
        - {name: POSTGRES_HOST, value: 192.168.0.2}
        - {name: POSTGRES_PORT, value: "5432"}
        - {name: POSTGRES_DATABASE, value: chatwoot_prod}
        - {name: POSTGRES_USERNAME, value: chatwoot_prod}
        - {name: REDIS_URL, value: redis://dc-redis.apps.svc.cluster.local:6379}
        - {name: SECRET_KEY_BASE, valueFrom: {secretKeyRef: {name: dc-secret, key: CHATWOOT_SECRET_KEY_BASE}}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: dc-secret, key: CHATWOOT_POSTGRES_PASSWORD}}}
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 2Gi
---
# Service — ClusterIP port 80 → named targetPort (cluster convention)
apiVersion: v1
kind: Service
metadata:
  name: dc-chatwoot-web
  namespace: apps
  labels:
    app.kubernetes.io/name: dc-chatwoot-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dc-chatwoot-web
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

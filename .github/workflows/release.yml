name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Read changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat git-cliff/CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-release:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary_name: dc
            asset_name: decent-cloud-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: dc
            asset_name: decent-cloud-darwin-arm64
          - os: ubuntu-24.04
            target: x86_64-pc-windows-gnu
            binary_name: dc.exe
            asset_name: decent-cloud-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Update version and lockfile
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          sed -i.bak 's/^version = "[0-9.]*"/version = "'"$VERSION"'"/' Cargo.toml
          rm -f Cargo.toml.bak
          cargo update --workspace

      - name: Remove local linker config
        run: rm -f .cargo/config.toml

      - name: Build Release Binary
        env:
          SQLX_OFFLINE: "true"
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            cargo install cross --git https://github.com/cross-rs/cross
            cross build --release --locked --target ${{ matrix.target }} --bin dc
          else
            cargo build --release --locked --target ${{ matrix.target }} --bin dc
          fi

      - name: Prepare binary
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  build-dc-agent:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update version and lockfile
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          sed -i 's/^version = "[0-9.]*"/version = "'"$VERSION"'"/' Cargo.toml
          cargo update --workspace

      - name: Build dc-agent
        run: ./scripts/build-dc-agent.sh

      - name: Prepare binary
        run: cp target/release/dc-agent dc-agent-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dc-agent-linux-amd64
          path: dc-agent-linux-amd64

  upload-release:
    needs: [create-release, build-release, build-dc-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Changelog
            ${{ needs.create-release.outputs.changelog }}
          files: release/*
          draft: false
          prerelease: false

  deploy-prod:
    needs: [upload-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DC_REPO_WRITE }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build API binaries
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --bin api-server --bin dc

      - name: Build website
        env:
          VITE_DECENT_CLOUD_API_URL: https://api.decent-cloud.org
        run: |
          cd website
          npm ci
          npm run build

      - name: Build and push images
        env:
          FORGEJO_OWNER: ${{ secrets.FORGEJO_OWNER }}
          FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          # Self-hosted runner: prefer rootless podman (no host/docker access needed);
          # fall back to docker if that is what is installed. Keep the local cargo cache.
          CTR="$(command -v podman || command -v docker)"
          [ -n "$CTR" ] || { echo "ERROR: neither podman nor docker found on runner" >&2; exit 1; }
          echo "Using container runtime: $CTR ($("$CTR" --version))"
          echo "$FORGEJO_TOKEN" | "$CTR" login git.kalaj.org -u "$FORGEJO_USER" --password-stdin
          "$CTR" build -f api/Dockerfile -t git.kalaj.org/${FORGEJO_OWNER}/decent-cloud-api:${TAG} .
          "$CTR" build -f cf/Dockerfile -t git.kalaj.org/${FORGEJO_OWNER}/decent-cloud-website:${TAG} .
          "$CTR" push git.kalaj.org/${FORGEJO_OWNER}/decent-cloud-api:${TAG}
          "$CTR" push git.kalaj.org/${FORGEJO_OWNER}/decent-cloud-website:${TAG}

      - name: Bump image tags in deploy/k8s/decent-cloud.yaml
        env:
          FORGEJO_OWNER: ${{ secrets.FORGEJO_OWNER }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          owner, tag = os.environ["FORGEJO_OWNER"], os.environ["TAG"]
          p = pathlib.Path("deploy/k8s/decent-cloud.yaml")
          text = p.read_text()
          for marker, name in (("deploy-prod:api", "decent-cloud-api"),
                               ("deploy-prod:website", "decent-cloud-website")):
              pat = re.compile(r"^(\s*image:\s*).*# " + re.escape(marker) + r"\s*$", re.M)
              repl = rf"\1git.kalaj.org/{owner}/{name}:{tag}  # {marker}"
              text, n = pat.subn(repl, text)
              # api image is shared by the `api` + `api-sync` Deployments (2 lines);
              # website is a single Deployment. Fail loud only if a marker vanished.
              assert n >= 1, f"no image line tagged {marker} found — check deploy/k8s/decent-cloud.yaml"
          p.write_text(text)
          print(f"Bumped decent-cloud-api + decent-cloud-website to {owner}:{tag}")
          PY

      - name: Commit and push image bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/decent-cloud.yaml
          git commit -m "deploy(decent-cloud): bump images to ${TAG}"
          git push origin HEAD:main

  update-version:
    needs: [create-release, upload-release, deploy-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update version in Cargo.toml and lockfile
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          sed -i "s/^version = \"[0-9.]*\"/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          # Use PAT instead of GITHUB_TOKEN for PR creation to avoid error
          # Error: GitHub Actions is not permitted to create or approve pull requests.
          token: ${{ secrets.DC_REPO_WRITE }}
          commit-message: "chore: bump version to ${{ needs.create-release.outputs.version }}"
          title: "chore: bump version to ${{ needs.create-release.outputs.version }}"
          body: |
            Updates version in Cargo.toml+lock files to match the latest release.

            This PR was automatically created by the release workflow.
          branch: bump-version-${{ needs.create-release.outputs.version }}
          base: main

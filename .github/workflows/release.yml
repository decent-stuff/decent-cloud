name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Read changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat git-cliff/CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-release:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary_name: dc
            asset_name: decent-cloud-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: dc
            asset_name: decent-cloud-darwin-arm64
          - os: ubuntu-24.04
            target: x86_64-pc-windows-gnu
            binary_name: dc.exe
            asset_name: decent-cloud-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Update version and lockfile
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          sed -i.bak 's/^version = "[0-9.]*"/version = "'"$VERSION"'"/' Cargo.toml
          rm -f Cargo.toml.bak
          cargo update --workspace

      - name: Remove local linker config
        run: rm -f .cargo/config.toml

      - name: Build Release Binary
        env:
          SQLX_OFFLINE: "true"
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            cargo install cross --git https://github.com/cross-rs/cross
            cross build --release --locked --target ${{ matrix.target }} --bin dc
          else
            cargo build --release --locked --target ${{ matrix.target }} --bin dc
          fi

      - name: Prepare binary
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  build-dc-agent:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update version and lockfile
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          sed -i 's/^version = "[0-9.]*"/version = "'"$VERSION"'"/' Cargo.toml
          cargo update --workspace

      - name: Build dc-agent
        run: ./scripts/build-dc-agent.sh

      - name: Prepare binary
        run: cp target/release/dc-agent dc-agent-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dc-agent-linux-amd64
          path: dc-agent-linux-amd64

  upload-release:
    needs: [create-release, build-release, build-dc-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Changelog
            ${{ needs.create-release.outputs.changelog }}
          files: release/*
          draft: false
          prerelease: false

  deploy-prod:
    needs: [upload-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build API binaries
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --bin api-server --bin dc

      - name: Build website
        env:
          # Pin VITE_* vars explicitly so the prod bundle is deterministic and never
          # inherits dev values from a stray local website/.env.local (which Vite would
          # otherwise pick up via `npm run build`). All VITE_ vars are public/client-side.
          VITE_DECENT_CLOUD_API_URL: https://api.decent-cloud.org
          # Chatwoot support widget — env-driven. The widget renders ONLY when
          # BOTH are set (see ChatwootWidget.svelte), so an unset pair yields a
          # console-clean bundle with the widget gated off. The base URL is a
          # non-secret repo Variable; the website token is an Actions Secret.
          # Operator: set repo var `CHATWOOT_BASE_URL` (public Chatwoot URL,
          # e.g. https://dev-support.decent-cloud.org) and Actions secret
          # `CHATWOOT_WEBSITE_TOKEN` (Chatwoot inbox → Configuration → Website
          # Token) to enable support chat. See cf/CONFIG.md → "Website build".
          VITE_CHATWOOT_BASE_URL: ${{ vars.CHATWOOT_BASE_URL }}
          VITE_CHATWOOT_WEBSITE_TOKEN: ${{ secrets.CHATWOOT_WEBSITE_TOKEN }}
          VITE_TELEGRAM_BOT_USERNAME: DecentCloudBot
        run: |
          cd website
          npm ci
          npm run build

      - name: Build and push images
        env:
          FORGEJO_OWNER: ${{ secrets.FORGEJO_OWNER }}
          FORGEJO_USER: ${{ secrets.FORGEJO_USER }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          # Self-hosted runner: prefer rootless podman (no host/docker access needed);
          # fall back to docker if that is what is installed. Keep the local cargo cache.
          CTR="$(command -v podman || command -v docker)"
          [ -n "$CTR" ] || { echo "ERROR: neither podman nor docker found on runner" >&2; exit 1; }
          echo "Using container runtime: $CTR ($("$CTR" --version))"
          echo "$FORGEJO_TOKEN" | "$CTR" login git.kalaj.org -u "$FORGEJO_USER" --password-stdin
          "$CTR" build -f api/Dockerfile -t git.kalaj.org/${FORGEJO_OWNER}/decent-cloud-api:${TAG} .
          "$CTR" build -f cf/Dockerfile -t git.kalaj.org/${FORGEJO_OWNER}/decent-cloud-website:${TAG} .
          "$CTR" push git.kalaj.org/${FORGEJO_OWNER}/decent-cloud-api:${TAG}
          "$CTR" push git.kalaj.org/${FORGEJO_OWNER}/decent-cloud-website:${TAG}

      - name: Bump image tags in nuc-k3s (cluster/apps/decent-cloud)
        env:
          FORGEJO_OWNER: ${{ secrets.FORGEJO_OWNER }}
          NUC_K3S_REPO_WRITE: ${{ secrets.NUC_K3S_REPO_WRITE }}
        run: |
          # Prod manifests live in sasa-tomic/nuc-k3s (ArgoCD GitOps, ns dc-prod), not
          # in this product repo. Clone it, run the shared bump script (which commits +
          # pushes), and let ArgoCD auto-sync. Manual fallback if CI can't push nuc-k3s:
          #   cd <nuc-k3s checkout> && python3 scripts/bump_app_images.py --tag "${TAG}" --push
          [ -n "$NUC_K3S_REPO_WRITE" ] || {
            echo "ERROR: NUC_K3S_REPO_WRITE secret is not set on decent-stuff/decent-cloud." >&2
            echo "       Add a PAT with write to sasa-tomic/nuc-k3s, or bump manually:" >&2
            echo "       python3 scripts/bump_app_images.py --tag ${TAG} --push  (in nuc-k3s checkout)" >&2
            exit 1; }
          git clone --depth 1 \
            https://x-access-token:${NUC_K3S_REPO_WRITE}@github.com/sasa-tomic/nuc-k3s.git /tmp/nuc-k3s
          python3 /tmp/nuc-k3s/scripts/bump_app_images.py --app decent-cloud --tag "${TAG}" \
            --owner "${FORGEJO_OWNER}" --push

  update-version:
    needs: [create-release, upload-release, deploy-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update version in Cargo.toml and lockfile
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          sed -i "s/^version = \"[0-9.]*\"/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          # Use PAT instead of GITHUB_TOKEN for PR creation to avoid error
          # Error: GitHub Actions is not permitted to create or approve pull requests.
          token: ${{ secrets.DC_REPO_WRITE }}
          commit-message: "chore: bump version to ${{ needs.create-release.outputs.version }}"
          title: "chore: bump version to ${{ needs.create-release.outputs.version }}"
          body: |
            Updates version in Cargo.toml+lock files to match the latest release.

            This PR was automatically created by the release workflow.
          branch: bump-version-${{ needs.create-release.outputs.version }}
          base: main
